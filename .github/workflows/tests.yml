name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["tools/**"]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tools -v
      - name: Policy and keys parse
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import update_catalogue as uc
          from pathlib import Path
          uc.load_policy(Path("policy"))
          uc.load_trusted_keys(Path("keys/trusted_keys.json"))
          print("policy and keys are well-formed")
          EOF
      - name: Catalogues at this commit verify
        run: python3 tools/update_catalogue.py verify site
